name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  test:
    uses: stylelint/.github/.github/workflows/call-test.yml@84d33533ebe0929b48fc85479f543fd5d41b221f # 3.0.0
    permissions:
      contents: read

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: stylelint/.github/.github/workflows/call-dependency-review.yml@84d33533ebe0929b48fc85479f543fd5d41b221f # 3.0.0
    permissions:
      contents: read
